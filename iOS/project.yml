name: ColdPlungeLog
options:
  bundleIdPrefix: com.shimondeitel.plungelog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  ColdPlungeLog:
    type: application
    platform: iOS
    sources:
      - path: ColdPlungeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.plungelog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ColdPlungeLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ColdPlungeLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColdPlungeLogTests
      - path: ColdPlungeLog.storekit
    dependencies:
      - target: ColdPlungeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.plungelog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ColdPlungeLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ColdPlungeLogUITests
    dependencies:
      - target: ColdPlungeLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.plungelog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ColdPlungeLog:
    build:
      targets:
        ColdPlungeLog: all
        ColdPlungeLogTests: [test]
        ColdPlungeLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ColdPlungeLog.storekit
    test:
      config: Debug
      storeKitConfiguration: ColdPlungeLog.storekit
      targets:
        - ColdPlungeLogTests
        - ColdPlungeLogUITests
    archive:
      config: Release
